name: Compilar APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Compilar APK (assembleDebug)
        run: |
          gradle assembleDebug --stacktrace

      - name: Preparar arquivos de saída
        run: |
          mkdir -p build-output
          DATE=$(date +'%Y%m%d-%H%M')
          COMMIT=$(echo "${{ github.sha }}" | cut -c1-7)
          cp app/build/outputs/apk/debug/app-debug.apk build-output/EstrelaDoFutebol-$DATE-$COMMIT.apk
          cp app/build/outputs/apk/debug/app-debug.apk build-output/EstrelaDoFutebol-latest.apk

      - name: Salvar APK como Artefato do Workflow
        uses: actions/upload-artifact@v4
        with:
          name: EstrelaDoFutebol-APK
          path: build-output/*.apk
          retention-days: 14

      - name: Atualizar Release 'latest' no GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "⚽ Estrela do Futebol - Última Versão"
          body: |
            ### 📱 Download do Jogo Atualizado
            
            O APK foi gerado automaticamente pelo GitHub Actions a cada atualização!
            
            - **Commit:** `${{ github.sha }}`
            - **Atualizado em:** `${{ github.event.head_commit.timestamp }}`
            
            👉 **Clique no arquivo `EstrelaDoFutebol-latest.apk` abaixo para baixar e instalar no Android!**
          draft: false
          prerelease: false
          files: build-output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
